<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review de Páginas Web</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<script src="script.js" defer></script>
</head>
<body>

<header>
  <div>
    <h1>Glass Point <em>Review</em></h1>
  </div>
  <div class="header-meta">Checklist de revisión de páginas</div>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-dot" style="background:#3ecf6b"></div><strong id="totalCards">0</strong>&nbsp;páginas</div>
  <div class="stat"><div class="stat-dot" style="background:#f5a623"></div><strong id="totalChecks">0</strong>&nbsp;checks totales</div>
  <div class="stat"><div class="stat-dot" style="background:#4ea8f7"></div><strong id="doneChecks">0</strong>&nbsp;completados</div>
</div>

<main id="cardGrid"></main>


</body>
</html>
